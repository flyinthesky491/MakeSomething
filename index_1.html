<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Figtree',system-ui,sans-serif}
  h1,h2{font-family:'Bricolage Grotesque',Georgia,serif}
</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-teal-900 via-teal-800 to-slate-900 text-slate-800">
<header class="sticky top-0 z-10 border-b border-white/10 bg-teal-900/90 backdrop-blur">
  <nav class="mx-auto flex max-w-xl items-center justify-between px-4 py-3">
    <span class="text-lg font-extrabold text-white">Hey Sagar</span>
    <div class="flex gap-1 text-sm font-semibold">
      <a href="tasks.html" class="rounded-lg px-2.5 py-1.5 text-teal-100 hover:bg-white/10 hover:text-white">Tasks</a>
      <a href="strategy.html" class="rounded-lg px-2.5 py-1.5 text-teal-100 hover:bg-white/10 hover:text-white">Strategy</a>
      <a href="learnings.html" class="rounded-lg px-2.5 py-1.5 text-teal-100 hover:bg-white/10 hover:text-white">Learnings</a>
      <a href="questions.html" class="rounded-lg px-2.5 py-1.5 text-teal-100 hover:bg-white/10 hover:text-white">Questions</a>
    </div>
  </nav>
</header>

<main class="mx-auto max-w-xl px-4 py-10 text-white">
  <h1 class="text-4xl font-extrabold tracking-tight">Hey Sagar,</h1>
  <p class="mt-2 text-teal-100">What's inside your mind today? Pick a section to log it.</p>

  <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2">
    <a href="tasks.html" class="rounded-2xl bg-white/10 p-5 shadow-lg transition hover:bg-white/20">
      <div class="text-2xl">✅</div>
      <div class="mt-2 text-lg font-bold">Tasks</div>
      <p class="mt-1 text-sm text-teal-100">Quick log of what you're doing.</p>
    </a>
    <a href="strategy.html" class="rounded-2xl bg-white/10 p-5 shadow-lg transition hover:bg-white/20">
      <div class="text-2xl">🧭</div>
      <div class="mt-2 text-lg font-bold">Strategy</div>
      <p class="mt-1 text-sm text-teal-100">Problem, plan, and result.</p>
    </a>
    <a href="learnings.html" class="rounded-2xl bg-white/10 p-5 shadow-lg transition hover:bg-white/20">
      <div class="text-2xl">💡</div>
      <div class="mt-2 text-lg font-bold">Learnings</div>
      <p class="mt-1 text-sm text-teal-100">Something new you picked up.</p>
    </a>
    <a href="questions.html" class="rounded-2xl bg-white/10 p-5 shadow-lg transition hover:bg-white/20">
      <div class="text-2xl">❓</div>
      <div class="mt-2 text-lg font-bold">Questions</div>
      <p class="mt-1 text-sm text-teal-100">Open questions worth tracking.</p>
    </a>
  </div>
</main>
</body>
</html>
