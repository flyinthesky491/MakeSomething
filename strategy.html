<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy — Strategy Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{font-family:'Figtree',system-ui,sans-serif} h1{font-family:'Bricolage Grotesque',Georgia,serif}</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-teal-900 via-teal-800 to-slate-900 text-slate-800">
<header class="sticky top-0 z-10 border-b border-white/10 bg-teal-900/90 backdrop-blur">
  <nav class="mx-auto flex max-w-xl items-center justify-between px-4 py-3">
    <a href="index.html" class="text-lg font-extrabold text-white">Hey Sagar</a>
    <div class="flex gap-1 text-sm font-semibold">
      <a href="tasks.html" class="rounded-lg px-2.5 py-1.5 text-teal-100 hover:bg-white/10 hover:text-white">Tasks</a>
      <a href="strategy.html" class="rounded-lg bg-white/15 px-2.5 py-1.5 text-white">Strategy</a>
      <a href="learnings.html" class="rounded-lg px-2.5 py-1.5 text-teal-100 hover:bg-white/10 hover:text-white">Learnings</a>
      <a href="questions.html" class="rounded-lg px-2.5 py-1.5 text-teal-100 hover:bg-white/10 hover:text-white">Questions</a>
    </div>
  </nav>
</header>

<main class="mx-auto max-w-xl px-4 py-8">
  <h1 class="mb-6 text-3xl font-extrabold text-white">Strategy</h1>

  <form id="f" class="space-y-5 rounded-3xl bg-white p-5 shadow-2xl sm:p-7">
    <div>
      <label for="Date" class="mb-1 block text-sm font-semibold">Date</label>
      <input type="date" id="Date" name="Date" required
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500">
    </div>
    <div>
      <label for="Scenario" class="mb-1 block text-sm font-semibold">Scenario</label>
      <textarea id="Scenario" name="Scenario" rows="3" required placeholder="Describe the situation"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
    </div>
    <div>
      <label for="Strategy" class="mb-1 block text-sm font-semibold">Strategy</label>
      <textarea id="Strategy" name="Strategy" rows="3" required placeholder="What will you do about it?"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
    </div>
    <div>
      <label for="Result" class="mb-1 block text-sm font-semibold">Result</label>
      <textarea id="Result" name="Result" rows="3" placeholder="What happened? Leave blank if not known yet"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
    </div>
    <button id="btn" type="submit"
      class="w-full rounded-xl bg-amber-400 px-4 py-3.5 text-lg font-bold text-slate-900 shadow transition active:scale-[0.98] hover:bg-amber-300 disabled:opacity-60">
      Save entry
    </button>
    <p id="msg" role="status" class="min-h-6 text-center text-sm font-medium"></p>
  </form>
</main>

<script src="app.js"></script>
<script>wireForm('Strategy');</script>
</body>
</html>
